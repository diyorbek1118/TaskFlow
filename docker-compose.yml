version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        PHP_VERSION: ${PHP_VERSION:-8.2}
    container_name: ${PROJECT_NAME:-laravel}-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ${PROJECT_PATH:-./laravel_project}:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - laravel

  mysql:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: ${PROJECT_NAME:-laravel}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  redis:
    image: redis:alpine
    container_name: ${PROJECT_NAME:-laravel}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - laravel

  nginx:
    image: nginx:latest
    container_name: ${PROJECT_NAME:-laravel}-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ${PROJECT_PATH:-./laravel_project}:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  # Optional: Queue worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        PHP_VERSION: ${PHP_VERSION:-8.2}
    container_name: ${PROJECT_NAME:-laravel}-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ${PROJECT_PATH:-./laravel_project}:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - laravel
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
